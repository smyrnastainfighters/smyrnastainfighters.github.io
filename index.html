<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Iframe</title>
    <style>
        /* Remove default margins and hide scrollbars on the main document */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Optional: background color while loading */
        }

        /* Force the iframe to occupy the full viewport */
        .fullscreen-iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999; /* Ensure it stays on top of any background elements */
        }
    </style>
</head>
<body>

    <iframe 
        src="https://smyrna-stain-fighters.ai.studio/" 
        class="fullscreen-iframe"
        allowfullscreen>
    </iframe>

</body>
</html>
